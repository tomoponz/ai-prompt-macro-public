name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install fixture browser
        run: npm run browser:install -- --with-deps
      - name: Run isolated browser fixture E2E
        run: npm run test:browser
      - name: Run repeat delivery browser regressions
        run: npm run test:browser:repeat
      - name: Run observed resource-card browser regressions
        run: npm run test:browser:resource-card
      - name: Run input, attachment, new-chat and layout browser regressions
        run: npm run test:browser:regressions
